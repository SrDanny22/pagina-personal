<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="titulo-avatar">
  <title id="titulo-avatar">Avatar ilustrado de Daniel Campos García</title>
  <defs>
    <clipPath id="recorte">
      <circle cx="60" cy="60" r="60"/>
    </clipPath>
  </defs>
  <!-- Fondo: círculo en color secundario -->
  <circle cx="60" cy="60" r="60" fill="#0F766E"/>
  <!-- Silueta (cabeza y hombros) en color fondo, recortada al círculo -->
  <g clip-path="url(#recorte)" fill="#F8FAFC">
    <circle cx="60" cy="44" r="19"/>
    <path d="M16 120 C16 88 36 70 60 70 C84 70 104 88 104 120 Z"/>
  </g>
  <!-- Símbolo </> en color acento sobre una placa en color primario -->
  <rect x="37" y="88" width="46" height="22" rx="6" fill="#1E3A8A"/>
  <text x="60" y="104" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="15" font-weight="700" fill="#F59E0B">&lt;/&gt;</text>
</svg>
